<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Reservar Turno | Barbería</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Estilos propios -->
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="bg-dark text-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card bg-black text-light border-warning">
            <div class="card-body">
              <h2 class="text-center mb-4 text-warning">Reservar Turno</h2>

              <form id="formTurno">
                <div class="mb-3">
                  <label class="form-label">Nombre</label>
                  <input type="text" class="form-control" required />
                </div>

                <div class="mb-3">
                  <label class="form-label">Teléfono</label>
                  <input type="tel" class="form-control" required />
                </div>

                <div class="mb-3">
                  <label class="form-label">Servicio</label>
                  <select id="servicio" class="form-select" required>
                    <option value="">Seleccionar</option>
                    <option value="corte" data-duration="30">
                      Corte de cabello
                    </option>
                    <option value="barba" data-duration="30">Barba</option>
                    <option value="corte-barba" data-duration="30">
                      Corte + barba
                    </option>
                    <option value="claritos" data-duration="120">
                      Claritos
                    </option>
                  </select>
                </div>

                <div class="mb-3">
                  <label class="form-label">Barbero</label>
                  <select class="form-select" required>
                    <option value="">Seleccionar</option>
                    <option>Hernan</option>
                    <option>Javier</option>
                  </select>
                </div>

                <div class="row">
                  <div class="col">
                    <label class="form-label">Fecha</label>
                    <input type="date" class="form-control" required />
                  </div>
                  <div class="col">
                    <label class="form-label">Horario</label>
                    <select
                      id="horaInicio"
                      class="form-select"
                      required
                    ></select>
                  </div>
                </div>
                <p class="mt-3 text-warning text-center">
                  <strong>Hora de finalización:</strong>
                  <span id="horaFin">--:--</span>
                </p>

                <div class="d-grid mt-4">
                  <button type="submit" class="btn btn-warning btn-lg">
                    Confirmar Turno
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="/js/turnos.js"></script>
</html>
