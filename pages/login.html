<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Acceso Barbería</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center" style="height:100vh;">

  <div class="card bg-black text-light border-warning p-4" style="min-width:300px;">
    <h3 class="text-warning text-center mb-4">Acceso privado</h3>

    <form id="loginForm">
      <div class="mb-3">
        <input type="text" id="user" class="form-control" placeholder="Usuario" required>
      </div>
      <div class="mb-3">
        <input type="password" id="pass" class="form-control" placeholder="Contraseña" required>
      </div>
      <div class="d-grid">
        <button class="btn btn-warning">Ingresar</button>
      </div>
      <p id="error" class="text-danger text-center mt-3"></p>
    </form>
  </div>

<script src="js/login.js"></script>
</body>
</html>
